<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Buddy</title>
    <style>
        body {
            background-color: lightgray;
            font-family: sans-serif;
            margin: 20px;
        }

        h1 {
            color: darkblue;
            text-align: center;
        }

        #chat-container {
            background-color: white;
            border: 2px solid navy;
            width: 80%;
            margin: 0 auto;
            padding: 15px;
            min-height: 320px;
            max-height: 500px;
            overflow-y: auto;
        }

        .question-box {
            color: darkblue;
            background-color: lightyellow;
            border: 1px solid gold;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }

        .answer-box {
            color: darkgreen;
            background-color: lightcyan;
            border: 1px solid teal;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }

        #input-container {
            width: 80%;
            margin: 15px auto;
            text-align: center;
        }

        input {
            width: 70%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid gray;
            border-radius: 4px;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: darkblue;
        }
    </style>
</head>
<body>

    <h1>📚 AI Study Buddy - Ray Optics 🎓</h1>

    <div id="chat-container">
        <p><b>Study Buddy:</b> Hello! Ask me any question related to the Ray Optics document!</p>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="Type your question here...">
        <button onclick="sendQuestion()">Ask</button>
    </div>

    <script>
        function sendQuestion() {
            var input = document.getElementById("user-input");
            var question = input.value.trim();
            if (question === "") return;

            var container = document.getElementById("chat-container");

            // Display User Question
            var qDiv = document.createElement("div");
            qDiv.className = "question-box";
            qDiv.innerHTML = "<b>You:</b> " + question;
            container.appendChild(qDiv);
            input.value = "";

            // Display Thinking Placeholder
            var thinkingDiv = document.createElement("div");
            thinkingDiv.className = "answer-box";
            thinkingDiv.innerHTML = "<b>Study Buddy:</b> Thinking...";
            container.appendChild(thinkingDiv);
            container.scrollTop = container.scrollHeight;

            // Send question to Flask backend
            fetch("/ask", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ question: question })
            })
            .then(response => response.json())
            .then(data => {
                thinkingDiv.innerHTML = "<b>Study Buddy:</b> " + data.answer;
                container.scrollTop = container.scrollHeight;
            })
            .catch(error => {
                thinkingDiv.innerHTML = "<b>Study Buddy:</b> Sorry, an error occurred. Please check your API keys.";
            });
        }

        // Allow pressing Enter to send question
        document.getElementById("user-input").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                sendQuestion();
            }
        });
    </script>

</body>
</html>
