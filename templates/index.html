<!DOCTYPE html>
<html>
<head>
    <title>AI Study Buddy</title>
    <style>
        body {
            background-color: lightgray;
            font-family: sans-serif;
            margin: 20px;
        }

        h1 {
            color: darkblue;
            text-align: center;
        }

        #chat-container {
            background-color: white;
            border: 2px solid navy;
            width: 80%;
            margin: 0 auto;
            padding: 15px;
            min-height: 300px;
        }

        .question-box {
            color: darkblue;
            background-color: lightyellow;
            border: 1px solid gold;
            padding: 8px;
            margin: 10px 0;
        }

        .answer-box {
            color: darkgreen;
            background-color: lightcyan;
            border: 1px solid teal;
            padding: 8px;
            margin: 10px 0;
        }

        #input-container {
            width: 80%;
            margin: 15px auto;
            text-align: center;
        }

        input {
            width: 65%;
            padding: 10px;
            font-size: 16px;
            border: 2px solid gray;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: darkblue;
        }
    </style>
</head>
<body>

    <h1>📚 AI Study Buddy - Ray Optics 🎓</h1>

    <div id="chat-container">
        <p><b>Study Buddy:</b> Hello! Ask me any question related to Ray Optics document!</p>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="Type your question here...">
        <button onclick="sendQuestion()">Ask</button>
    </div>

    <script>
        function sendQuestion() {
            var input = document.getElementById("user-input");
            var question = input.value;
            if (question == "") return;

            var container = document.getElementById("chat-container");

            // Display User Question
            container.innerHTML += "<div class='question-box'><b>You:</b> " + question + "</div>";
            input.value = "";

            // Display Thinking placeholder
            var thinkingDiv = document.createElement("div");
            thinkingDiv.className = "answer-box";
            thinkingDiv.innerHTML = "<b>Study Buddy:</b> Thinking...";
            container.appendChild(thinkingDiv);

            // Send question to Flask backend
            fetch("/ask", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ question: question })
            })
            .then(response => response.json())
            .then(data => {
                thinkingDiv.innerHTML = "<b>Study Buddy:</b> " + data.answer;
            });
        }
    </script>

</body>
</html>
